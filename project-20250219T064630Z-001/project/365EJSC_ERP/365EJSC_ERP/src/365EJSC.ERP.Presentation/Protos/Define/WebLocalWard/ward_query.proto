syntax = "proto3";
import "result.proto";
import "google/protobuf/wrappers.proto";

package WardGrpcQuery;

service WardQuery {
    rpc GetWard(GetWardRequest) returns (CommonResult);
    rpc GetAllWards(GetAllWardsRequest) returns (CommonResult);
}

message GetWardRequest {
    optional google.protobuf.Int32Value Id = 1;
}

message GetAllWardsRequest {
}
